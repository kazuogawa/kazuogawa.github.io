name: Verify Pull Request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # pnpm 10 is intentionally pinned because Dependabot could not resolve pnpm 12's standalone binary.
      # Keep this aligned with package.json until a Dependabot run confirms newer pnpm support.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: make install
      - name: Check
        run: make check
      - name: Build
        run: make build
