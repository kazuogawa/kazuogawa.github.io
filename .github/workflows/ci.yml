name: Verify Pull Request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Dependabotがpnpm 12の実行バイナリを解決できなかったため、pnpm 10へ意図的に固定する。
      # 新しいpnpmへの更新は、Dependabotでの動作確認後にpackage.jsonと同時に行うこと。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: make install
      - name: Check
        run: make check
      - name: Build
        run: make build
