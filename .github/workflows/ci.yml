name: Verify Pull Request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install dependencies
        run: make install
      - name: Check
        run: make check
      - name: Build
        run: make build
