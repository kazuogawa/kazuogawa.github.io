name: Playwright E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # pnpm 10 is intentionally pinned because Dependabot could not resolve pnpm 12's standalone binary.
      # Keep this aligned with package.json until a Dependabot run confirms newer pnpm support.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: make install
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check
        run: make check
      - name: Run Playwright tests
        run: pnpm test:e2e
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
