name: Check external links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * 1'

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: false

jobs:
  check:
    name: Check published site
    runs-on: ubuntu-latest
    steps:
      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            https://kazuogawa.github.io/
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
