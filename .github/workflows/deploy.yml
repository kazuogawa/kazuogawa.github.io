name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.codex/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # pnpm 10 is intentionally pinned because Dependabot could not resolve pnpm 12's standalone binary.
      # Keep this aligned with package.json until a Dependabot run confirms newer pnpm support.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: make install
      - name: Check
        run: make check
      - name: Build
        run: make build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
